name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    container:
      image: goreleaser/goreleaser-cross:v1.25
    steps:
      - name: Install system dependencies
        run: |
          # Add LunarG repository for Vulkan SDK
          wget -qO /usr/share/keyrings/lunarg-vulkan-keyring.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          . /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/lunarg-vulkan-keyring.asc] https://packages.lunarg.com/vulkan ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/lunarg-vulkan.list
          apt-get update
          apt-get install -y \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libffi-dev \
            libxcursor-dev \
            libgtk-3-dev \
            pkg-config \
            wget \
            apt-transport-https \
            ca-certificates \
            vulkan-headers \
            libvulkan-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Run GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean
